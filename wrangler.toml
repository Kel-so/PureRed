# Cloudflare Workers (static assets) — publishes only the site/ folder.
# Videos live on Backblaze B2 (see docs/HOSTING.md).
# In Workers & Pages → your project → Settings → Build: build command empty,
# deploy command "npx wrangler deploy". The name below must match the project name.
name = "purered"
compatibility_date = "2026-09-01"

[assets]
directory = "./site"
